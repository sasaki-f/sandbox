<!doctype html>
<html lang="ja" class="route-loading">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>設備の予約</title>
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/schedule.css" />
    <link rel="stylesheet" href="css/responsive.css" />
    <link rel="stylesheet" href="css/theme.css" />
  </head>

  <body>
    <main class="app">
      <header>
        <button class="icon-button" id="back" aria-label="戻る">
          <svg class="icon">
            <path d="m15 4-8 8 8 8" />
          </svg>
        </button>
        <h1>予約</h1>
      </header>
      <div class="tabs" role="tablist">
        <button id="mine-tab" role="tab" class="active" aria-selected="true" aria-controls="mine">
          ホーム</button
        ><button id="search-tab" role="tab" aria-selected="false" aria-controls="search">
          予約の検索
        </button>
      </div>
      <section id="mine" role="tabpanel" aria-labelledby="mine-tab">
        <div class="monthbar">
          <button class="icon-button" id="prev" aria-label="前の月">〈</button
          ><button
            id="month-title"
            class="month-title-button"
            aria-haspopup="dialog"
            aria-label="表示する年月を選択"
          >
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <rect x="3" y="5" width="18" height="16" rx="2" />
              <path d="M3 10h18M8 3v4M16 3v4" /></svg
            ><span id="month-label"></span></button
          ><button class="icon-button" id="next" aria-label="次の月">〉</button>
        </div>
        <div class="weekdays">
          <span>月</span><span>火</span><span>水</span><span>木</span><span>金</span
          ><span class="sat">土</span><span class="sun">日</span>
        </div>
        <div class="calendar" id="calendar"></div>
        <aside id="day-panel" hidden>
          <div class="day-list" hidden>
            <h2 class="list-title">
              <span id="day-title"></span><span class="count" id="day-count"></span>
            </h2>
            <div id="day-rows"></div>
          </div>
          <button class="new" id="new" hidden><span>＋</span>新規予約</button>
        </aside>
      </section>
      <section id="search" role="tabpanel" aria-labelledby="search-tab" hidden>
        <div class="search-box">
          <button class="search-toggle" id="toggle" aria-expanded="true">
            <svg class="icon">
              <circle cx="10" cy="10" r="8" />
              <path d="m16 16 7 7" /></svg
            ><span id="toggle-label">検索条件を閉じる</span
            ><span class="fold" aria-hidden="true"
              ><svg
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="m5 9 7 7 7-7" /></svg
            ></span>
          </button>
          <div class="fields" id="fields">
            <label for="start">期間</label>
            <div class="dates">
              <input id="start" type="date" value="2026-10-01" aria-label="開始日" /><span>〜</span
              ><input id="end" type="date" value="2026-10-31" aria-label="終了日" />
            </div>
            <label for="search-category">カテゴリー</label>
            <select id="search-category">
              <option value="">すべてのカテゴリー</option>
              <option>会議室</option>
              <option>プロジェクター</option>
              <option>車両</option>
              <option>モニター</option>
              <option>面談室</option>
            </select>
            <label class="search-extra-label" for="search-equipment">設備名</label>
            <input id="search-equipment" type="search" placeholder="設備名で検索" />
            <label class="search-extra-label" for="keyword">タイトル</label>
            <input id="keyword" type="search" placeholder="予約のタイトルで検索" />
            <label class="search-author-label" for="search-author">投稿者</label>
            <input id="search-author" type="search" placeholder="投稿者名で検索" />
          </div>
        </div>
        <div class="results">
          <h2>検索結果　<span id="result-count">5件</span></h2>
          <div id="result-rows"></div>
          <nav
            id="result-pagination"
            class="result-pagination"
            aria-label="検索結果のページ送り"
          ></nav>
        </div>
      </section>
      <section id="categories" class="category-page" hidden aria-label="設備一覧">
        <div class="category-search">
          <svg class="icon" aria-hidden="true">
            <circle cx="10" cy="10" r="8" />
            <path d="m16 16 7 7" /></svg
          ><input
            id="category-keyword"
            type="search"
            placeholder="フリーワードで設備を検索"
            aria-label="設備一覧のフリーワード検索"
          />
        </div>
        <h2>検索結果　全<span id="category-count">5</span>件</h2>
        <div id="category-rows"></div>
      </section>
    </main>
    <dialog id="detail">
      <h2 id="detail-title"></h2>
      <img class="detail-image" id="detail-image" alt="" />
      <p class="detail-text" id="detail-text"></p>
      <div class="actions">
        <button onclick="document.querySelector('#detail').close()">閉じる</button>
      </div>
    </dialog>
    <dialog id="create">
      <form id="create-form">
        <h2>新規予約</h2>
        <label
          >設備<select name="equipment">
            <option>会議室A</option>
            <option>会議室B</option>
            <option>面談室</option>
            <option>プロジェクター</option>
            <option>モニター</option>
            <option>車両</option>
          </select></label
        ><label>予約日<input name="date" type="date" required /></label
        ><label>開始時刻<input name="from" type="time" value="10:00" required /></label
        ><label>終了時刻<input name="to" type="time" value="11:00" required /></label>
        <p id="form-error" style="color: #d93131" role="alert"></p>
        <div class="actions">
          <button type="button" id="cancel">キャンセル</button
          ><button class="primary" type="submit">予約する</button>
        </div>
      </form>
    </dialog>
    <div class="toast" id="toast" role="status" hidden></div>
    <script src="js/app.js"></script>
    <script src="js/schedule.js"></script>
    <script src="js/mock-data.js"></script>
    <script src="js/weekly.js"></script>
    <script src="js/date-picker.js"></script>
    <script src="js/booking.js"></script>
    <script src="js/scroll-snap.js"></script>
    <script src="js/day-popup.js"></script>
    <script src="js/search-layout.js"></script>
    <script src="js/category-tree.js"></script>
    <script src="js/sidebar.js"></script>
    <script src="js/calendar-shortcuts.js"></script>
    <script src="js/router.js"></script>
  </body>
</html>
