<!doctype html>
<html lang="ja">

    <head>
        <meta charset="UTF-8">
        <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
        <title>設備の予約</title>
        <style>
            :root {
                --blue: #008ee9;
                --ink: #111820;
                --muted: #747c91;
                --line: #e4e9ef
            }

            * {
                box-sizing: border-box
            }

            body {
                margin: 0;
                background: #f1f5f9;
                color: var(--ink);
                font-family: Meiryo, "メイリオ", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", Roboto, sans-serif
            }

            button,
            input,
            select {
                font: inherit
            }

            button {
                cursor: pointer
            }

            button:focus-visible,
            input:focus-visible,
            select:focus-visible {
                outline: 3px solid #70bfff;
                outline-offset: 2px
            }

            .app {
                max-width: 490px;
                margin: 24px auto;
                background: #fff;
                min-height: calc(100dvh - 48px);
                box-shadow: 0 12px 55px #25476314;
                border-radius: 28px;
                overflow: hidden;
                position: relative;
                padding-bottom: 20px
            }

            .status {
                height: 38px;
                padding: 12px 30px 0;
                display: flex;
                justify-content: space-between;
                font-size: 16px;
                font-weight: 700
            }

            .status span:last-child {
                letter-spacing: 2px;
                font-size: 13px
            }

            header {
                display: flex;
                align-items: center;
                gap: 20px;
                padding: 14px 20px 12px
            }

            h1 {
                font-size: 23px;
                margin: 0;
                font-weight: 800
            }

            .icon-button {
                border: 0;
                background: transparent;
                padding: 6px;
                color: inherit;
                display: grid;
                place-items: center
            }

            svg.icon {
                width: 25px;
                height: 25px;
                fill: none;
                stroke: currentColor;
                stroke-width: 2;
                stroke-linecap: round;
                stroke-linejoin: round
            }

            .tabs {
                display: flex;
                background: #eaf5ff;
                border-radius: 12px;
                margin: 0 16px 18px
            }

            .tabs button {
                position: relative;
                width: 50%;
                border: 0;
                background: none;
                padding: 13px 0;
                color: #7772cf;
                font-size: 19px;
                font-weight: 700;
                border-radius: 11px
            }

            .tabs button.active {
                background: #2889e3;
                color: white;
                box-shadow: inset 0 0 0 3px #fff, 0 0 0 2px #79bdff;
                border-radius: 14px
            }

            .monthbar {
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 4px 20px 15px
            }

            .monthbar strong {
                font-size: 21px
            }

            .today {
                border: 1px solid #a4d2ff;
                background: #fff;
                border-radius: 24px;
                color: var(--blue);
                padding: 7px 24px;
                font-weight: 700
            }

            .weekdays {
                display: grid;
                grid-template-columns: repeat(7, 1fr);
                text-align: center;
                color: #555d70;
                font-size: 14px;
                padding: 0 8px 6px
            }

            .sun {
                color: #ff2525 !important
            }

            .sat {
                color: #0065ff !important
            }

            .calendar {
                display: grid;
                grid-template-columns: repeat(7, 1fr);
                margin: 0 8px;
                border-left: 1px solid var(--line);
                border-top: 1px solid var(--line);
                border-radius: 6px;
                overflow: hidden
            }

            .day {
                height: 73px;
                border: 0;
                border-right: 1px solid var(--line);
                border-bottom: 1px solid var(--line);
                background: #fff;
                padding: 7px 3px 3px;
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 4px;
                font-size: 16px
            }

            .day.outside {
                color: #b9bec9
            }

            .day.selected {
                background: #ecf8ff;
                box-shadow: inset 0 0 0 1.5px #009bff;
                border-radius: 7px
            }

            .event {
                max-width: 100%;
                font-size: 10px;
                line-height: 1.6;
                background: linear-gradient(#e7f7ff, #d6efff);
                padding: 1px 5px;
                border-radius: 4px;
                color: #00427e;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis
            }

            .day-list {
                margin: 14px 18px 10px;
                border: 1px solid #e8edf3;
                box-shadow: 0 1px 4px #1729430c;
                border-radius: 15px;
                padding: 10px 9px 0
            }

            .list-title {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin: 0 0 5px;
                font-size: 19px;
                font-weight: 800
            }

            .count {
                font-size: 15px;
                color: #626b80;
                font-weight: 500
            }

            .row {
                width: 100%;
                display: flex;
                text-align: left;
                align-items: center;
                gap: 17px;
                background: none;
                border: 0;
                border-top: 1px solid var(--line);
                padding: 7px 0;
                color: inherit
            }

            .thumb {
                width: 88px;
                height: 65px;
                object-fit: cover;
                border-radius: 9px;
                flex-shrink: 0
            }

            .row-info {
                flex: 1;
                min-width: 0
            }

            .row-name {
                display: block;
                font-size: 16px;
                font-weight: 700;
                margin-bottom: 3px
            }

            .row-time {
                display: block;
                font-size: 15px;
                color: #626b80;
                line-height: 1.5
            }

            .row-person {
                color: #737b8b;
                font-size: 14px
            }

            .chevron {
                font-size: 30px;
                font-weight: 300;
                margin-right: 4px
            }

            .new {
                margin: 0 18px;
                width: calc(100% - 36px);
                border: 0;
                border-radius: 12px;
                background: var(--blue);
                color: white;
                padding: 15px;
                font-size: 18px;
                font-weight: 700
            }

            .new span {
                font-size: 26px;
                vertical-align: -2px;
                margin-right: 12px
            }

            .search-box {
                background: #eaf6ff;
                margin: 0 20px 18px;
                padding: 16px 18px 13px;
                border-radius: 16px
            }

            .search-toggle {
                display: flex;
                align-items: center;
                width: 100%;
                gap: 11px;
                border: 0;
                background: none;
                color: #0077ff;
                font-size: 19px;
                font-weight: 800;
                padding: 0 0 13px
            }

            .search-toggle .fold {
                margin-left: auto;
                color: #18242e
            }

            .fields {
                border-top: 1px solid #d3e5f4;
                padding-top: 12px
            }

            .fields label {
                display: block;
                font-weight: 700;
                margin-bottom: 7px
            }

            .dates {
                display: flex;
                align-items: center;
                gap: 10px;
                margin-bottom: 14px
            }

            .fields input {
                background: white;
                border: 1px solid #e5edf4;
                border-radius: 10px;
                padding: 12px 11px;
                width: 100%;
                min-width: 0;
                font-size: 15px
            }

            .dates input {
                width: calc(50% - 15px)
            }

            .results {
                margin: 0 24px
            }

            .results h2 {
                font-size: 20px;
                margin: 0 0 4px
            }

            .results .row {
                padding: 8px 0
            }

            .results .thumb {
                height: 74px
            }

            .results .row-time {
                color: #006bff;
                font-size: 14px
            }

            .empty {
                padding: 28px 8px;
                text-align: center;
                color: var(--muted)
            }

            nav {
                position: absolute;
                bottom: 0;
                left: 0;
                right: 0;
                background: #ffffffed;
                border-top: 1px solid var(--line);
                display: flex;
                padding: 12px 0 14px
            }

            nav button {
                flex: 1;
                background: none;
                border: 0;
                color: #7e849c;
                font-size: 12px;
                font-weight: 600;
                display: flex;
                flex-direction: column;
                gap: 5px;
                align-items: center
            }

            nav button.active {
                color: var(--blue)
            }

            nav svg.icon {
                height: 28px;
                width: 28px
            }

            [hidden] {
                display: none !important
            }

            dialog {
                border: 0;
                border-radius: 20px;
                padding: 24px;
                width: calc(100% - 36px);
                max-width: 430px;
                box-shadow: 0 20px 80px #17304633
            }

            dialog::backdrop {
                background: #15273966
            }

            dialog h2 {
                font-size: 21px;
                margin: 0 0 18px
            }

            dialog label {
                display: block;
                font-size: 14px;
                font-weight: 700;
                margin: 12px 0
            }

            dialog input,
            dialog select {
                width: 100%;
                border: 1px solid #dbe3ec;
                border-radius: 8px;
                padding: 11px;
                margin-top: 5px
            }

            .actions {
                display: flex;
                justify-content: flex-end;
                gap: 10px;
                margin-top: 22px
            }

            .actions button {
                border: 0;
                background: #edf3f8;
                border-radius: 9px;
                padding: 10px 18px
            }

            .actions .primary {
                background: var(--blue);
                color: white
            }

            .detail-image {
                width: 100%;
                height: 160px;
                object-fit: cover;
                border-radius: 12px
            }

            .detail-text {
                line-height: 1.9;
                color: #586276
            }

            .toast {
                position: fixed;
                bottom: 100px;
                left: 50%;
                transform: translateX(-50%);
                padding: 12px 22px;
                border-radius: 30px;
                background: #182a40;
                color: white;
                z-index: 5;
                font-size: 14px;
                white-space: nowrap
            }

            @media(max-width:540px) {
                body {
                    background: white
                }

                .app {
                    margin: 0;
                    border-radius: 0;
                    box-shadow: none;
                    min-height: 100dvh
                }

                .status {
                    padding-top: 10px
                }

                .day {
                    height: 74px
                }
            }

            @media(min-width:541px) {
                .app {
                    min-height: 900px
                }
            }

            .category-page {
                padding: 8px 18px 24px
            }

            .category-search {
                position: relative;
                margin-bottom: 24px
            }

            .category-search svg {
                position: absolute;
                left: 14px;
                top: 14px;
                color: #8492a5
            }

            .category-search input {
                width: 100%;
                border: 1px solid #dfe7ef;
                background: #f7faff;
                border-radius: 12px;
                padding: 14px 14px 14px 48px;
                font-size: 16px
            }

            .category-page h2 {
                font-size: 19px;
                margin: 0 0 12px
            }

            .category-row {
                width: 100%;
                display: flex;
                align-items: center;
                justify-content: space-between;
                border: 1px solid #e3eaf2;
                border-radius: 9px;
                background: #fff;
                margin-bottom: 8px;
                padding: 17px 20px;
                font-size: 20px;
                font-weight: 700;
                text-align: left
            }

            .category-row:hover {
                background: #f1f8ff;
                border-color: #b7dbff
            }

            .category-row .chevron {
                font-weight: 400;
                margin: 0
            }
        .calendar .event{background:#fbdcdd;border:1px solid #efb9bc;color:#641a17}
</style>

</head>

    <body>
        <main class="app">
            
            <header><button class="icon-button" id="back" aria-label="戻る"><svg class="icon">

                    </svg></button>
                <h1>予約</h1>
            </header>
            <div class="tabs" role="tablist"><button id="mine-tab" role="tab" class="active" aria-selected="true"

            <section id="mine" role="tabpanel" aria-labelledby="mine-tab">

        </main>
        <dialog id="detail">
            <h2 id="detail-title"></h2><img class="detail-image" id="detail-image" alt="">

            </form>
        </dialog>

            function key(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}` } function dateText(s) { const d = new Date(s + 'T00:00:00'); return `${s.replaceAll('-', '/')}（${weekdays[d.getDay()]}）` }
            function row(r, search) { const b = document.createElement('button'); b.className = 'row'; const img = document.createElement('img'); img.className = 'thumb'; img.src = artwork(r.name); img.alt = r.name; const info = document.createElement('span'); info.className = 'row-info'; const name = document.createElement('span'); name.className = 'row-name'; name.textContent = search ? (r.title || r.booking?.title || '設備予約') : r.name; if (search) { const equipment = document.createElement('span'); equipment.className = 'row-equipment'; equipment.textContent = r.name; info.append(equipment) } const time = document.createElement('span'); time.className = 'row-time'; time.textContent = (search ? dateText(r.date) + ' ' : '') + r.from + ' 〜 ' + r.to; info.append(name, time); if (search) info.prepend(name); if (search) { const p = document.createElement('span'); p.className = 'row-person'; p.textContent = r.person; info.append(p) } const arrow = document.createElement('span'); arrow.className = 'chevron'; arrow.textContent = '›'; b.append(img, info, arrow); b.onclick = () => { $('#detail-title').textContent = r.name; $('#detail-image').src = artwork(r.name); $('#detail-image').alt = r.name; $('#detail-text').textContent = dateText(r.date) + ' ' + r.from + ' 〜 ' + r.to + '　予約者：' + (r.person || '自分'); $('#detail').showModal() }; return b }
            function render() { $('#day-panel').hidden = !selected; $('.day-list').hidden = !selected; $('#new').hidden = !selected; $('#month-label').textContent = `${year}/${String(month + 1).padStart(2,'0')}`; const first = new Date(year, month, 1), last = new Date(year, month + 1, 0); const offset = (first.getDay() + 6) % 7; const total = Math.ceil((offset + last.getDate()) / 7) * 7; $('#calendar').replaceChildren(); for (let i = 0; i < total; i++) { const d = new Date(year, month, i - offset + 1), s = key(d), items = mine.filter(r => r.date === s); const b = document.createElement('button'); b.className = 'day' + (d.getMonth() !== month ? ' outside' : d.getDay() === 0 ? ' sun' : d.getDay() === 6 ? ' sat' : '') + (s === selected ? ' selected' : ''); b.setAttribute('aria-label', dateText(s) + ` ${items.length}件の予約`); b.setAttribute('aria-pressed', String(s === selected)); const n = document.createElement('span'); n.textContent = d.getDate(); b.append(n); if (items.length) { const event = document.createElement('span'); event.className = 'event'; event.textContent = items[0].name; b.append(event); if (items.length > 1) { const more = document.createElement('span'); more.className = 'event'; more.textContent = s === selected ? items[1].name : `他${items.length - 1}件`; b.append(more) } } b.onclick = () => { selected = s; if (d.getMonth() !== month) { year = d.getFullYear(); month = d.getMonth() } render(); showDayReservations() }; $('#calendar').append(b) } if (!selected) return; const d = new Date(selected + 'T00:00:00'); $('#day-title').textContent = `${d.getMonth() + 1}月${d.getDate()}日（${weekdays[d.getDay()]}）の予約`; const items = mine.filter(r => r.date === selected); $('#day-count').textContent = items.length + '件'; $('#day-rows').replaceChildren(...items.map(r => row(r, false))); if (!items.length) $('#day-rows').innerHTML = '<p class="empty">この日の予約はありません</p>' }
            function search(event) { if(event?.type === 'input') reservationSearchPage = 1; const normalize = value => String(value || '').normalize('NFKC').toLowerCase(); const kw = normalize($('#keyword').value.trim()), author = normalize($('#search-author').value).replace(/\s/g, ''), start = $('#start').value, end = $('#end').value; const items = reservations.filter(r => (!start || r.date >= start) && (!end || r.date <= end) && normalize(r.title || r.booking?.title || '設備予約').includes(kw) && normalize(r.person).replace(/\s/g, '').includes(author)); $('#result-count').textContent = items.length + '件'; const pageCount = Math.max(1, Math.ceil(items.length / reservationPageSize)); reservationSearchPage = Math.min(reservationSearchPage, pageCount); const pageStart = (reservationSearchPage - 1) * reservationPageSize; $('#result-rows').replaceChildren(...items.slice(pageStart, pageStart + reservationPageSize).map(r => row(r, true))); renderReservationPagination(items.length, pageCount); if (!items.length) $('#result-rows').innerHTML = '<p class="empty">条件に一致する予約はありません</p>' }
            function tab(searching) { if (!searching) render(); $('#categories').hidden = true; $('.tabs').hidden = false; $('h1').textContent = '予約'; $('#mine').hidden = searching; $('#search').hidden = !searching; for (const [id, on] of [['mine-tab', !searching], ['search-tab', searching]]) { $('#' + id).classList.toggle('active', on); $('#' + id).setAttribute('aria-selected', String(on)) } } $('#mine-tab').onclick = () => tab(false); $('#search-tab').onclick = () => tab(true); $('#prev').onclick = () => move(-1); $('#next').onclick = () => move(1); function move(n) { const d = new Date(year, month + n, 1); year = d.getFullYear(); month = d.getMonth(); selected = null; render() }  $('#toggle').onclick = () => { const closed = !$('#fields').hidden; $('#fields').hidden = closed; $('#toggle').setAttribute('aria-expanded', String(!closed)); $('#toggle-label').textContent = closed ? '検索条件を開く' : '検索条件を閉じる'; $('.fold').classList.toggle('is-collapsed',closed) };['keyword', 'search-author', 'start', 'end'].forEach(id => $('#' + id).addEventListener('input', search)); $('#new').onclick = () => { $('#mine').hidden = true; $('#search').hidden = true; $('.tabs').hidden = true; $('#categories').hidden = false; $('h1').textContent = '設備一覧'; $('#category-keyword').value = ''; renderCategories() }; $('#cancel').onclick = () => $('#create').close(); $('#create-form').onsubmit = e => { e.preventDefault(); const f = e.target.elements; if (f.to.value <= f.from.value) { $('#form-error').textContent = '終了時刻は開始時刻より後にしてください。'; return } const r = { name: f.equipment.value, date: f.date.value, from: f.from.value, to: f.to.value, person: '自分' }; if (mine.concat(reservations).some(x => x.name === r.name && x.date === r.date && x.from < r.to && x.to > r.from)) { $('#form-error').textContent = 'この設備は選択した時間帯に予約されています。'; return } mine.push(r); reservations.push(r); selected = r.date; const d = new Date(r.date + 'T00:00:00'); year = d.getFullYear(); month = d.getMonth(); render(); search(); tab(fa             const equipmentCategories = ['プロジェクター', '会議室', '車両', 'モニター', '面談室'];
            function renderCategories() { const keyword = $('#category-keyword').value.trim().toLowerCase(); const items = equipmentCategories.filter(name => name.toLowerCase().includes(keyword)); $('#category-count').textContent = items.length; $('#category-rows').replaceChildren(...items.map(name => { const button = document.createElement('button'); button.className = 'category-row'; const label = document.createElement('span'); label.textContent = name; const arrow = document.createElement('span'); arrow.className = 'chevron'; arrow.textContent = '›'; button.append(label, arrow); button.onclick = () => { $('#create-form').reset(); $('#create-form').elements.equipment.value = name === '会議室' ? '会議室A' : name; $('#create-form').elements.date.value = selected; $('#form-error').textContent = ''; $('#create').showModal() }; return button })); if (!items.length) $('#category-rows').innerHTML = '<p class="empty">条件に一致するカテゴリーはありません</p>' }
